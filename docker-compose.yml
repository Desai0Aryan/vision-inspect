# docker compose up --build            -> dashboard + API on http://localhost:8000 (slim image)
# docker compose --profile full up --build app-full   -> same, with the PyTorch backend available
services:
  app:
    build:
      context: .
      target: runtime
    image: visioninspect:latest
    ports:
      - "8000:8000"
    environment:
      VI_MAX_UPLOAD_MB: "200"
      VI_CORS: "*"
    volumes:
      - jobs:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 4

  app-full:
    profiles: ["full"]
    build:
      context: .
      target: full
    image: visioninspect:full
    ports:
      - "8000:8000"
    volumes:
      - jobs:/data

volumes:
  jobs:
